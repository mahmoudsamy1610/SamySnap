<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SamySnap</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row spread">
      <h1><img src="../icons/icon32.png" alt="" /> SamySnap</h1>
      <span id="shortcut" class="muted kbd"></span>
    </header>

    <!-- First run -->
    <section id="connect-view" hidden>
      <p>Connect your Google Drive once. Recordings go to a <b>Bug Recordings</b> folder and the share link is copied the moment you stop.</p>
      <button id="connect" class="big primary">Connect Google Drive</button>
    </section>

    <!-- Main -->
    <section id="main-view" hidden>
      <button id="toggle" class="big record"><span class="dot"></span><span id="toggle-label">Record</span></button>

      <div id="live" class="row spread live" hidden>
        <span id="phase-label" class="row"></span>
        <span id="timer" class="timer">0:00</span>
      </div>
      <p id="upload-status" class="muted" hidden></p>

      <p id="warning" class="notice warn" hidden></p>
      <div id="error-box" class="notice err" hidden>
        <div id="error"></div>
        <div class="row actions">
          <button id="retry" hidden>Retry upload</button>
          <button id="download" hidden>Download video</button>
          <button id="dismiss">Dismiss</button>
        </div>
      </div>

      <label class="row option">
        <input type="checkbox" id="mic" /> Include microphone
      </label>

      <section class="history">
        <h2>Last links</h2>
        <ul id="history"></ul>
        <p id="history-empty" class="muted">No recordings yet.</p>
      </section>

      <footer class="row spread muted">
        <span>Saved to Drive › Bug Recordings</span>
        <button id="disconnect" class="link-btn">Disconnect</button>
      </footer>
    </section>

    <template id="history-item">
      <li class="row spread">
        <div class="meta">
          <a class="name" target="_blank" rel="noopener"></a>
          <span class="sub muted"></span>
        </div>
        <button class="copy">Copy</button>
      </li>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
