<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Screenshot copied</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body>
    <main>
      <img id="preview" alt="Screenshot preview" />
      <div class="info">
        <p id="status" class="status">Copying…</p>
        <p id="hint" class="muted">Paste it anywhere with Ctrl+V</p>
        <div class="row actions">
          <button id="download">Save as file</button>
          <button id="keep" class="link-btn">Keep open</button>
        </div>
      </div>
    </main>
    <script type="module" src="shot.js"></script>
  </body>
</html>
